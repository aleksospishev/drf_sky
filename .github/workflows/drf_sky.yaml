name: Django-app workflow

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.12

    - name: Install dependencies
      run: | 
        python -m pip install --upgrade pip 
        pip install flake8 pep8-naming flake8-broken-line flake8-return flake8-isort
        pip install -r requirement.txt 

    - name: Test with flake8
      run: |
        python -m flake8

  build_and_push_to_docker_hub_backend:
    name: Push Docker image backend  to Docker Hub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Docker
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/drf_sky:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - tests
      - build_and_push_to_docker_hub_backend
    steps:
      - name: create .env
        run: |
            touch .env
            echo SECRET_KEY =${{ secrets.SECRET_KEY }} >> .env
            echo POSTGRES_DB=${{ secrets.POSTGRES_DB }} >> .env
            echo POSTGRES_USER=${{ secrets.POSTGRES_USER }} >> .env
            echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> .env
            echo POSTGRES_HOST=${{ secrets.POSTGRES_HOST }} >> .env
            echo PORT=${{ secrets.PORT }} >> .env
            echo STRIPE_API_KEY =${{ secrets.STRIPE_API_KEY }} >> .env
            echo E_MAIL =${{ secrets.EMAIL }} >> .env
            echo PASS_MAIL =${{ secrets.PASS_MAIL}} >>§ .env
      


      - name: Set up SSH
        run: |
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            docker pull ${{ secrets.DOCKER_USERNAME }}/drf_sky:latest
            docker stop web || true
            docker rm web || true
            docker run -d --name web -p 80:8000 ${{ secrets.USERNAME }}/drf_sky:latest
          EOF

